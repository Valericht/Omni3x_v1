; Omni-3X - Single Controller (ESP32-S3)
[env:omni3x]
platform = espressif32@6.5.0          ; Arduino-ESP32 2.0.14 (IDF 4.4, ada usb_host + API ledcSetup)
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 460800
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DARDUINO_USB_CDC_ON_BOOT=0       ; Serial = UART0 (port "UART"), pin GPIO19/20 dibiarkan untuk USB Host
    -DCORE_DEBUG_LEVEL=1
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=0 ; AsyncTCP di Core 0
    -DCONFIG_ASYNC_TCP_USE_WDT=0
lib_deps =
    https://github.com/me-no-dev/AsyncTCP.git
    https://github.com/me-no-dev/ESPAsyncWebServer.git
    bblanchon/ArduinoJson@^7.0.4
